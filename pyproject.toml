[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-data-hub"
version = "0.3.0"
description = "Open-source Windsor.ai alternative: GA4, Search Console, Google Ads & Meta Ads into one local database - queryable by API, CSV, and AI assistants (MCP)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bhargava" }]
keywords = ["marketing", "analytics", "ga4", "search-console", "mcp", "duckdb", "windsor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10,<4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
    "google-analytics-data>=0.18",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
googleads = ["google-ads>=24.0"]
meta = ["facebook-business>=19.0"]

[project.urls]
Homepage = "https://github.com/rallabandibhargava-dev/marketing-data-hub"
Issues = "https://github.com/rallabandibhargava-dev/marketing-data-hub/issues"

[project.scripts]
hub = "hub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
