name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pyinstaller>=6.10"
      - name: Build the actual GUI and CLI
        working-directory: packaging
        run: pyinstaller --noconfirm --clean --distpath dist --workpath ../build hub.spec
      - run: python packaging/smoke_test.py packaging/dist/MarketingDataHub
