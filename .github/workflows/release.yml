name: release
on:
  push:
    tags: ["v*"]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  wheel:
    needs: [tests, installer]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  installer:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pyinstaller>=6.10"
      - run: choco install innosetup --no-progress -y
      - name: Build bundle
        working-directory: packaging
        run: pyinstaller --noconfirm --clean --distpath dist --workpath ../build hub.spec
      - name: Build installer
        id: build_installer
        working-directory: packaging
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:HUB_VERSION = $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Copy-Item dist\MarketingDataHub-Setup.exe "dist\MarketingDataHub-Setup-$version.exe"
      - name: Smoke test the GUI and its sync child
        run: python packaging/smoke_test.py packaging/dist/MarketingDataHub
      # Initial releases may be unsigned. Record the exact trust status with
      # the download; switch this step back to verify_signatures.ps1 once a
      # publisher signing identity is configured.
      - name: Record publisher-signing status
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem packaging/dist/MarketingDataHub-Setup*.exe | ForEach-Object { $_.FullName })
          $files = @('packaging/dist/MarketingDataHub/hub.exe', 'packaging/dist/MarketingDataHub/MarketingDataHub.exe') + $installers
          $files | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_
            "$([IO.Path]::GetFileName($_)): $($signature.Status)"
          } | Set-Content packaging/dist/SIGNING-STATUS.txt
      - name: Record installer checksums
        shell: pwsh
        run: |
          Get-ChildItem packaging/dist/MarketingDataHub-Setup-*.exe | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content packaging/dist/SHA256SUMS.txt
      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packaging/dist/MarketingDataHub-Setup-${{ steps.build_installer.outputs.version }}.exe
            packaging/dist/SHA256SUMS.txt
            packaging/dist/SIGNING-STATUS.txt
          retention-days: 14
      - name: Publish the installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/MarketingDataHub-Setup.exe
            packaging/dist/MarketingDataHub-Setup-${{ steps.build_installer.outputs.version }}.exe
            packaging/dist/SHA256SUMS.txt
            packaging/dist/SIGNING-STATUS.txt
          generate_release_notes: true
  macos:
    needs: installer
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pyinstaller>=6.10"
      - name: Build app bundle
        id: build
        working-directory: packaging
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          HUB_VERSION="$version" pyinstaller --noconfirm --clean --distpath dist --workpath ../build hub.spec
      - name: Smoke test the GUI and its sync child
        run: python packaging/smoke_test.py "packaging/dist/Marketing Data Hub.app"
      # Unsigned for now (PyInstaller applies an ad-hoc signature). Notarize
      # with an Apple Developer ID here once one is configured, so Gatekeeper
      # stops asking users to right-click > Open on first launch.
      - name: Build disk image
        working-directory: packaging
        run: |
          version="${{ steps.build.outputs.version }}"
          ./build_dmg.sh "dist/Marketing Data Hub.app" "dist/MarketingDataHub-macOS-${{ matrix.arch }}.dmg"
          cp "dist/MarketingDataHub-macOS-${{ matrix.arch }}.dmg" "dist/MarketingDataHub-macOS-${{ matrix.arch }}-$version.dmg"
          cd dist && shasum -a 256 MarketingDataHub-macOS-*-$version.dmg > "SHA256SUMS-macOS-${{ matrix.arch }}.txt"
      - name: Upload disk image as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: |
            packaging/dist/MarketingDataHub-macOS-${{ matrix.arch }}-${{ steps.build.outputs.version }}.dmg
            packaging/dist/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          retention-days: 14
      - name: Publish the disk images
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/MarketingDataHub-macOS-${{ matrix.arch }}.dmg
            packaging/dist/MarketingDataHub-macOS-${{ matrix.arch }}-${{ steps.build.outputs.version }}.dmg
            packaging/dist/SHA256SUMS-macOS-${{ matrix.arch }}.txt
